# HTTP -> HTTPS redirect (all domains)
server {
    listen 80;
    server_name metaguildx.net www.metaguildx.net admin.metaguildx.net signer.metaguildx.net;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main web app
server {
    listen 443 ssl http2;
    server_name metaguildx.net www.metaguildx.net;
    root /var/www/web/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/metaguildx.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metaguildx.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}

# Admin app (IP restricted)
server {
    listen 443 ssl http2;
    server_name admin.metaguildx.net;
    root /var/www/admin/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/metaguildx.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metaguildx.net/privkey.pem;

    # Replace with your actual public IP
    # allow YOUR_PUBLIC_IP;
    # deny all;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Signer service (proxied, public with auth)
server {
    listen 443 ssl http2;
    server_name signer.metaguildx.net;

    ssl_certificate /etc/letsencrypt/live/metaguildx.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metaguildx.net/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limiting at nginx level too
        limit_req zone=signer burst=5 nodelay;
    }
}

# Rate limit zone (add in nginx.conf http block)
# limit_req_zone $binary_remote_addr zone=signer:10m rate=10r/m;
